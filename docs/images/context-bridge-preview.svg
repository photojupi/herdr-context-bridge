  <path d="M630 411H644m-5-5 6 5-6 5" fill="none" stroke="#b9cbea" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- The expanded overlay keeps the two providers and handoff controls together. -->
  <g clip-path="url(#details-clip)">
