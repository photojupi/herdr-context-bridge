<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="764" viewBox="0 0 1200 764" role="img" aria-labelledby="title description">
  <title id="title">Context Bridge: bottom summary and details on demand</title>
  <desc id="description">Illustration with example data. A wide coding workspace has a compact bottom summary showing Claude five-hour quota 32 percent and weekly quota 61 percent, and Codex five-hour quota 44 percent and weekly quota 72 percent remaining. Clicking the summary opens Context Bridge, with quota cards, Ask every time selected, and a Confirm manual handoff button.</desc>
  <defs>
    <linearGradient id="background" x2="0" y2="1">
      <stop stop-color="#171b22"/>
      <stop offset="1" stop-color="#101318"/>
    </linearGradient>
    <clipPath id="workspace-clip"><rect x="24" y="128" width="590" height="566" rx="12"/></clipPath>
    <clipPath id="details-clip"><rect x="660" y="128" width="516" height="566" rx="12"/></clipPath>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
      .primary { fill: #e9edf3; }
      .secondary { fill: #a5adba; }
      .muted { fill: #7f8897; }
      .label { font-size: 15px; font-weight: 600; }
      .small { font-size: 13px; }
      .body { font-size: 14px; }
      .rule { stroke: #333943; }
    </style>
  </defs>

  <rect width="1200" height="764" rx="18" fill="url(#background)"/>
  <text x="24" y="45" class="primary" font-size="25" font-weight="650">Context Bridge</text>
  <text x="24" y="70" class="secondary" font-size="15">Usage at a glance. Handoff controls when you need them.</text>
  <rect x="938" y="28" width="238" height="30" rx="15" fill="#222831" stroke="#3b4451"/>
  <circle cx="955" cy="43" r="3" fill="#a7bbda"/>
  <text x="969" y="48" class="secondary" font-size="13">Illustration · example data</text>

  <circle cx="36" cy="105" r="12" fill="#293342"/>
  <text x="36" y="110" text-anchor="middle" fill="#c5d8f5" font-size="13" font-weight="600">1</text>
  <text x="57" y="110" class="primary" font-size="17" font-weight="600">Bottom summary</text>
  <circle cx="672" cy="105" r="12" fill="#293342"/>
  <text x="672" y="110" text-anchor="middle" fill="#c5d8f5" font-size="13" font-weight="600">2</text>
  <text x="693" y="110" class="primary" font-size="17" font-weight="600">Details on demand</text>

