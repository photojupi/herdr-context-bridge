    <rect x="706" y="404" width="305" height="4" rx="2" fill="#a3bbdc"/>

    <rect x="692" y="431" width="452" height="30" rx="6" fill="#2d333c" stroke="#48515e"/>
    <text x="918" y="451" text-anchor="middle" class="primary body">Select source session</text>
    <text x="692" y="485" class="primary label">Handoff settings</text>
    <text x="692" y="509" class="secondary body">Remaining quota threshold: 10%</text>
    <rect x="1085" y="490" width="26" height="26" rx="5" fill="#2d333c" stroke="#48515e"/>
    <path d="M1094 503H1102" stroke="#c1c9d4" stroke-width="1.5"/>
    <rect x="1118" y="490" width="26" height="26" rx="5" fill="#2d333c" stroke="#48515e"/>
