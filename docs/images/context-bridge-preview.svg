  <rect x="24" y="128" width="590" height="566" rx="12" fill="none" stroke="#3b4451"/>
  <path d="m510 682 1-24 17 17-10-1-4 9Z" fill="#e4edfa" stroke="#141a22" stroke-width="2" stroke-linejoin="round"/>

