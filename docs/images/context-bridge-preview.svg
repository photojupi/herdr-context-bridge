      <rect x="673" y="219" width="209" height="6" rx="3"/>
      <rect x="673" y="241" width="137" height="6" rx="3"/>
      <rect x="673" y="636" width="205" height="6" rx="3"/>
      <rect x="673" y="658" width="300" height="6" rx="3"/>
    </g>
    <rect x="660" y="128" width="516" height="566" fill="#080b10" opacity=".45"/>
