    <text x="116" y="677" class="secondary body">5h <tspan fill="#e9edf3">32%</tspan></text>
    <text x="178" y="677" class="secondary body">Weekly <tspan fill="#e9edf3">61%</tspan></text>
    <path d="M276 663V681" stroke="#3c4655"/>
